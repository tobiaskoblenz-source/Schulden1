<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101c"><title>Schulden Manager · Anmeldung</title><link rel="stylesheet" href="/login-v170.css?v=172"></head><body><main class="authCard"><div class="logo">SM</div><div class="head"><h1>Schulden Manager</h1><p id="subtitle">Sicher anmelden.</p></div><div class="tabs"><button class="tab active" data-tab="login" type="button">Anmelden</button><button class="tab" id="registerTab" data-tab="register" type="button">Registrieren</button></div><section id="loginPane" class="pane active"><form id="loginForm" autocomplete="on"><label>Benutzername<input id="loginUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="next" required></label><label>Passwort<div class="passwordField"><input id="loginPass" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required><button class="showPass" id="showLoginPass" type="button" aria-label="Passwort anzeigen">Anzeigen</button></div></label><button class="primary" id="loginBtn" type="submit">Anmelden</button><div class="msg" id="loginMsg"></div></form><p class="hint">Falls dein Handy alte Zugangsdaten automatisch einträgt: Passwort mit „Anzeigen“ prüfen und notfalls einmal manuell neu eingeben.</p></section><section id="registerPane" class="pane"><div id="setupInfo" class="notice">Die Registrierung ist nur für den ersten Administrator verfügbar.</div><form id="registerForm"><label>Name<input id="regName" autocomplete="name" placeholder="z. B. Tobias"></label><label>Benutzername<input id="regUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label><label>Passwort<div class="passwordField"><input id="
