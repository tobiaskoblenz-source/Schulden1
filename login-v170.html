<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101c"><title>Schulden Manager · Anmeldung</title><link rel="stylesheet" href="/login-v170.css?v=170"></head><body><main class="authCard"><div class="logo">SM</div><div class="head"><h1>Schulden Manager</h1><p id="subtitle">Sicher anmelden.</p></div><div class="tabs"><button class="tab active" data-tab="login">Anmelden</button><button class="tab" id="registerTab" data-tab="register">Registrieren</button></div><section id="loginPane" class="pane active"><form id="loginForm"><label>Benutzername<input id="loginUser" autocomplete="username" required></label><label>Passwort<input id="loginPass" type="password" autocomplete="current-password" required></label><button class="primary">Anmelden</button><div class="msg" id="loginMsg"></div></form><p class="hint">Admins landen in der normalen App, Berater automatisch im Beraterbereich.</p></section><section id="registerPane" class="pane"><div id="setupInfo" class="notice">Die Registrierung ist nur für den ersten Administrator verfügbar.</div><form id="registerForm"><label>Name<input id="regName" autocomplete="name" placeholder="z. B. Tobias"></label><label>Benutzername<input id="regUser" autocomplete="username" required></label><label>Passwort<input id="regPass" type="password" autocomplete="new-password" minlength="8" required></label><label>Passwort wiederholen<input id="regPass2" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">Admin registrieren</button><div class="msg" id="registerMsg"></div></form></section></main><script src="/login-v170.js?v=170" defer></script></body></html>
